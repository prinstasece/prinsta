<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Registration - Printsta SECE</title>
  <meta name="description" content="Register as a copier center operator on Printsta.">
  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Shared Design System stylesheet -->
  <link rel="stylesheet" href="style.css">
  <style>
    .input-helper {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 4px;
      padding-left: 2px;
      font-weight: 500;
    }
    .username-feedback {
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 4px;
      min-height: 18px;
    }
    .username-feedback.valid { color: #16a34a; }
    .username-feedback.invalid { color: #ef4444; }
  </style>
</head>
<body>

  <!-- Dynamic Alert Notification Popup -->
  <div id="alertPopup" class="alert-popup"></div>

  <!-- Header Section -->
  <header class="header">
    <img src="assets/sece-logo.png" alt="SECE Logo" class="sece-logo-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\' viewBox=\'0 0 60 60\'><rect width=\'60\' height=\'60\' fill=\'%231a2a4a\' rx=\'10\'/><text x=\'50%\' y=\'55%\' font-family=\'sans-serif\' font-size=\'10\' fill=\'white\' text-anchor=\'middle\' font-weight=\'bold\'>SECE</text></svg>'">
    <a href="index.html" class="wordmark"><span class="prin">prin</span><span class="sta">sta</span></a>
  </header>

  <!-- Main Container -->
  <main class="form-container">
    <h1 class="page-heading">Staff Registration</h1>
    <p style="text-align: center; font-size: 0.85rem; color: var(--gray-text); margin-bottom: 1.5rem; margin-top: -1rem;">
      Printsta Copier Center Operator Account
    </p>

    <form id="staffRegisterForm">
      <!-- Full Name -->
      <div class="form-group">
        <label for="staffName">Full Name</label>
        <div class="input-wrapper">
          <input type="text" id="staffName" placeholder="Enter your full name" required>
        </div>
      </div>

      <!-- Username -->
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input type="text" id="username" placeholder="Choose a username" required autocomplete="username">
        </div>
        <div class="input-helper">This will be your login username — e.g., copier_sece or printstaff1</div>
        <div id="usernameFeedback" class="username-feedback"></div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Create a password (min 8 characters)" required autocomplete="new-password">
          <button type="button" id="passwordToggleBtn" class="input-icon-btn" tabindex="-1" title="Toggle password visibility">
            <svg viewBox="0 0 24 24"><path d="M18,8h-1V6c0-2.76-2.24-5-5-5S7,3.24,7,6v2H6C4.9,8,4,8.9,4,10v10c0,1.1,0.9,2,2,2h12c1.1,0,2-0.9,2-2V10C20,8.9,19.1,8,18,8z M9,6c0-1.66,1.34-3,3-3s3,1.34,3,3v2H9V6z M12,17c-1.1,0-2-0.9-2-2s0.9-2,2-2s2,0.9,2,2S13.1,17,12,17z"/></svg>
          </button>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password">
          <button type="button" id="confirmPasswordToggleBtn" class="input-icon-btn" tabindex="-1" title="Toggle password visibility">
            <svg viewBox="0 0 24 24"><path d="M18,8h-1V6c0-2.76-2.24-5-5-5S7,3.24,7,6v2H6C4.9,8,4,8.9,4,10v10c0,1.1,0.9,2,2,2h12c1.1,0,2-0.9,2-2V10C20,8.9,19.1,8,18,8z M9,6c0-1.66,1.34-3,3-3s3,1.34,3,3v2H9V6z M12,17c-1.1,0-2-0.9-2-2s0.9-2,2-2s2,0.9,2,2S13.1,17,12,17z"/></svg>
          </button>
        </div>
      </div>

      <!-- Secret Registration Code -->
      <div class="form-group">
        <label for="secretCode">Secret Registration Code</label>
        <div class="input-wrapper">
          <input type="password" id="secretCode" placeholder="Enter secret code" required>
        </div>
        <div class="input-helper">Get the registration code from your college administrator</div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-primary" style="margin-top: 1.5rem;">Create Staff Account</button>
    </form>

    <!-- Login Link -->
    <a href="index.html" class="link-small-center" style="margin-top: 1.5rem;">Already have an account? <span>Login</span></a>
  </main>

  <script>
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? 'http://localhost:3000' : 'https://printsta-backend.onrender.com';

    // ── Alert helper ──
    function showAlert(message, type = 'success') {
      const popup = document.getElementById('alertPopup');
      popup.innerText = message;
      popup.className = `alert-popup ${type}`;
      popup.style.display = 'block';
      setTimeout(() => { popup.style.display = 'none'; }, 4000);
    }

    // ── Password Visibility Toggles ──
    const passwordInput = document.getElementById('password');
    const passwordToggleBtn = document.getElementById('passwordToggleBtn');
    passwordToggleBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        passwordToggleBtn.style.backgroundColor = '#f5a623';
      } else {
        passwordInput.type = 'password';
        passwordToggleBtn.style.backgroundColor = '#1a2a4a';
      }
    });

    const confirmPasswordInput = document.getElementById('confirmPassword');
    const confirmPasswordToggleBtn = document.getElementById('confirmPasswordToggleBtn');
    confirmPasswordToggleBtn.addEventListener('click', () => {
      if (confirmPasswordInput.type === 'password') {
        confirmPasswordInput.type = 'text';
        confirmPasswordToggleBtn.style.backgroundColor = '#f5a623';
      } else {
        confirmPasswordInput.type = 'password';
        confirmPasswordToggleBtn.style.backgroundColor = '#1a2a4a';
      }
    });

    // ── Username live validation ──
    const usernameInput = document.getElementById('username');
    const usernameFeedback = document.getElementById('usernameFeedback');

    usernameInput.addEventListener('input', () => {
      const val = usernameInput.value;
      if (!val) {
        usernameFeedback.textContent = '';
        usernameFeedback.className = 'username-feedback';
        return;
      }

      if (/^[a-zA-Z0-9_]{3,30}$/.test(val)) {
        usernameFeedback.textContent = '✓ Username format is valid';
        usernameFeedback.className = 'username-feedback valid';
      } else {
        usernameFeedback.textContent = '✗ Alphanumeric & underscores only (3-30 chars)';
        usernameFeedback.className = 'username-feedback invalid';
      }
    });

    // ── Form Submission ──
    const form = document.getElementById('staffRegisterForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('staffName').value.trim();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const secretCode = document.getElementById('secretCode').value;

      // Validation
      if (!/^[a-zA-Z0-9_]{3,30}$/.test(username)) {
        showAlert('Username format is invalid.', 'error');
        usernameInput.focus();
        return;
      }

      if (password.length < 8) {
        showAlert('Password must be at least 8 characters.', 'error');
        passwordInput.focus();
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Passwords do not match.', 'error');
        confirmPasswordInput.focus();
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/auth/staff/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, username, password, secretCode })
        });
        const data = await response.json();

        if (response.ok && data.success) {
          showAlert('Staff account created successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2000);
        } else {
          showAlert(data.message || 'Registration failed.', 'error');
        }
      } catch (err) {
        console.error(err);
        showAlert('Could not connect to the server.', 'error');
      }
    });
  </script>
</body>
</html>
