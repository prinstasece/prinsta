<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - Printsta SECE</title>
  <meta name="description" content="Register for Printsta — the SECE college print ordering system.">
  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Shared Design System stylesheet -->
  <link rel="stylesheet" href="style.css">
  <style>
    /* Register form specific grid styles */
    .register-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 1.5rem;
      row-gap: 1rem;
      width: 100%;
    }
    .grid-full-width { grid-column: span 2; }

    .btn-center-container {
      display: flex;
      justify-content: center;
      width: 100%;
      margin-top: 2rem;
    }
    .btn-register-submit { width: 200px; }

    /* Email validation feedback */
    .email-feedback {
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 4px;
      min-height: 18px;
      padding-left: 2px;
    }
    .email-feedback.valid   { color: #16a34a; }
    .email-feedback.invalid { color: #ef4444; }

    /* Auto-fill info banner - removed */

    /* Responsive */
    @media (max-width: 680px) {
      .register-grid { grid-template-columns: 1fr; }
      .grid-full-width { grid-column: span 1; }
    }

    /* Email Verification Modal Overlay */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center;
      z-index: 1000; backdrop-filter: blur(4px);
    }
    .modal-card {
      background: #ffffff; border-radius: 16px; padding: 2rem;
      width: 100%; max-width: 420px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
      border: 1px solid #e2e8f0; text-align: center;
      animation: modalSlide 0.3s ease-out;
    }
    .otp-input {
      width: 100%; padding: 0.75rem; border: 1.5px solid #cbd5e1; border-radius: 8px;
      font-size: 1.5rem; letter-spacing: 0.5rem; text-align: center; margin-top: 1rem; margin-bottom: 1.5rem;
      outline: none; font-weight: bold; color: #1a2a4a;
    }
    .otp-input:focus {
      border-color: #f5a623;
    }
    @keyframes modalSlide {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Dynamic Alert Notification Popup -->
  <div id="alertPopup" class="alert-popup"></div>

  <!-- Header Section -->
  <header class="header">
    <img src="assets/sece-logo.png" alt="SECE Logo" class="sece-logo-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'60\' height=\'60\' viewBox=\'0 0 60 60\'><rect width=\'60\' height=\'60\' fill=\'%231a2a4a\' rx=\'10\'/><text x=\'50%\' y=\'55%\' font-family=\'sans-serif\' font-size=\'10\' fill=\'white\' text-anchor=\'middle\' font-weight=\'bold\'>SECE</text></svg>'">
    <a href="index.html" class="wordmark"><span class="prin">prin</span><span class="sta">sta</span></a>
  </header>

  <!-- Two-Column Sign Up Layout -->
  <main class="grid-container">
    <h1 class="page-heading">Sign up into your account</h1>

    <form id="registerForm">
      <div class="register-grid">

        <!-- Row 1: First Name -->
        <div class="form-group">
          <label for="firstName">First Name</label>
          <div class="input-wrapper">
            <input type="text" id="firstName" placeholder="Enter first name" required>
          </div>
        </div>

        <!-- Row 1: Last Name -->
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <div class="input-wrapper">
            <input type="text" id="lastName" placeholder="Enter last name" required>
          </div>
        </div>

        <!-- Row 2: SECE Email (full width) -->
        <div class="form-group grid-full-width">
          <label for="email">SECE Email Id <span style="color:#64748b;font-weight:400;font-size:0.8rem;">(e.g. kavin.v2025ece@sece.ac.in)</span></label>
          <div class="input-wrapper">
            <input type="email" id="email" placeholder="yourname.initial2025dept@sece.ac.in" required autocomplete="email">
            <button type="button" class="input-icon-btn" tabindex="-1">
              <svg viewBox="0 0 24 24"><path d="M20,4H4C2.9,4,2,4.9,2,6v12c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V6C22,4.9,21.1,4,20,4z M20,8l-8,5L4,8V6l8,5l8-5V8z"/></svg>
            </button>
          </div>
          <div class="email-feedback" id="emailFeedback"></div>
        </div>

        <!-- Row 3: Mobile No. -->
        <div class="form-group">
          <label for="phone">Mobile No.</label>
          <div class="input-wrapper">
            <input type="text" id="phone" placeholder="+91 98596 58000" required>
          </div>
        </div>

        <!-- Row 3: Register Number -->
        <div class="form-group">
          <label for="registerNumber">Register / Roll Number <span style="color:#64748b;font-weight:400;font-size:0.8rem;">(e.g. 722825106001 or 25BEADMEC145)</span></label>
          <div class="input-wrapper">
            <input type="text" id="registerNumber" placeholder="722825106001 or 25BEADMEC145" maxlength="20" required autocomplete="off" oninput="onRegNumInput()" style="text-transform: uppercase;">
          </div>
          <div id="regNumFeedback" style="font-size:0.8rem;font-weight:600;margin-top:4px;min-height:18px;"></div>
        </div>

        <!-- Row 4: Department (auto-filled, overrideable) -->
        <div class="form-group">
          <label for="department">Department</label>
          <div class="input-wrapper">
            <select id="department" required>
              <option value="" disabled selected>Select Department</option>
              <option value="CSE">Computer Science &amp; Engineering (CSE)</option>
              <option value="CSBS">Computer Science &amp; Business Systems (CSBS)</option>
              <option value="IT">Information Technology (IT)</option>
              <option value="AIDS">AI &amp; Data Science (AIDS)</option>
              <option value="AIML">AI &amp; Machine Learning (AIML)</option>
              <option value="ECE">Electronics &amp; Communication Engineering (ECE)</option>
              <option value="EEE">Electrical &amp; Electronics Engineering (EEE)</option>
              <option value="MECH">Mechanical Engineering (MECH)</option>
              <option value="Cyber Security">Cyber Security (CYS)</option>
              <option value="CCE">Computer &amp; Communication Engineering (CCE)</option>
            </select>
          </div>
        </div>

        <!-- Row 4: Batch (auto-filled, overrideable) -->
        <div class="form-group">
          <label for="batch">Batch</label>
          <div class="input-wrapper">
            <select id="batch" required>
              <option value="" disabled selected>Select Batch</option>
              <option value="2021-2025">2021 – 2025</option>
              <option value="2022-2026">2022 – 2026</option>
              <option value="2023-2027">2023 – 2027</option>
              <option value="2024-2028">2024 – 2028</option>
              <option value="2025-2029">2025 – 2029</option>
              <option value="2026-2030">2026 – 2030</option>
              <option value="2027-2031">2027 – 2031</option>
              <option value="2028-2032">2028 – 2032</option>
              <option value="2029-2033">2029 – 2033</option>
            </select>
          </div>
        </div>

        <!-- Row 5: Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="Create a password" required>
          </div>
        </div>

        <!-- Row 5: Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
          </div>
        </div>

      </div>

      <!-- Centered 200px Sign up Button -->
      <div class="btn-center-container">
        <button type="submit" class="btn-primary btn-register-submit">Sign up</button>
      </div>
    </form>

    <!-- Already have an account link -->
    <a href="index.html" class="link-small-center" style="margin-top: 1rem;">Already have an account? <span>Login now</span></a>
  </main>

  <script>
    const API_BASE = 'https://printsta-backend.onrender.com';

    // ── Alert helper ──
    function showAlert(message, type = 'success') {
      const popup = document.getElementById('alertPopup');
      popup.innerText = message;
      popup.className = `alert-popup ${type}`;
      popup.style.display = 'block';
      setTimeout(() => { popup.style.display = 'none'; }, 4000);
    }

    // ── SECE email validation ──
    const SECE_PATTERN = /^[a-z]+\.[a-z]+([\d]{4})(ece|cse|mech|eee|cys|aiml|aids|cce|it|csbs)@sece\.ac\.in$/i;

    function validateSECEEmail(email) {
      if (!email.toLowerCase().endsWith('@sece.ac.in')) {
        return { valid: false, error: 'Only SECE college email addresses are allowed (@sece.ac.in)' };
      }
      if (!SECE_PATTERN.test(email)) {
        return { valid: false, error: 'Format should be: name.initial2025ece@sece.ac.in' };
      }
      return { valid: true };
    }

    // ── Extract dept & batch from SECE email ──
    const DEPT_MAP = {
      ece: 'ECE', cse: 'CSE', mech: 'MECH', eee: 'EEE',
      cys: 'Cyber Security', aiml: 'AIML', aids: 'AIDS',
      cce: 'CCE', it: 'IT', csbs: 'CSBS'
    };

    function extractFromSECEEmail(email) {
      if (!email.toLowerCase().endsWith('@sece.ac.in')) return null;
      const local = email.split('@')[0].toLowerCase();
      const match = local.match(/[a-z]+\.([a-z]+?)(\d{4})(ece|cse|mech|eee|cys|aiml|aids|cce|it|csbs)$/);
      if (!match) return null;
      const startYear = parseInt(match[2]);
      return {
        department: DEPT_MAP[match[3]] || match[3].toUpperCase(),
        batch: `${startYear}-${startYear + 4}`
      };
    }

    // ── Email blur handler: validate + auto-fill ──
    const emailInput    = document.getElementById('email');
    const emailFeedback = document.getElementById('emailFeedback');

    emailInput.addEventListener('blur', () => {
      const val = emailInput.value.trim();
      if (!val) {
        emailFeedback.textContent = '';
        emailFeedback.className = 'email-feedback';
        return;
      }

      const result = validateSECEEmail(val);
      if (!result.valid) {
        emailFeedback.textContent = result.error;
        emailFeedback.className = 'email-feedback invalid';
        return;
      }

      emailFeedback.textContent = 'Valid SECE email';
      emailFeedback.className = 'email-feedback valid';

      // Auto-fill department and batch silently
      const profile = extractFromSECEEmail(val);
      if (profile) {
        document.getElementById('department').value = profile.department;
        document.getElementById('batch').value = profile.batch;
      }
    });

    // Clear feedback while typing
    emailInput.addEventListener('input', () => {
      emailFeedback.textContent = '';
      emailFeedback.className = 'email-feedback';
    });

    // ── Register Number Validation ──
    // Format: 7228 (college) + 2-digit year + 3-digit dept code + 3-digit serial = 12 digits
    const REG_DEPT_CODES = {
      '205': 'IT',
      '149': 'CYBER',
      '148': 'AIML',
      '251': 'CSE',
      '105': 'EEE',
      '114': 'MECH',
      '244': 'CSBS',
      '134': 'CCE',
      '106': 'ECE',
      '243': 'AIDS'
    };

    // Maps register dept value to the department select option values
    const REG_DEPT_TO_SELECT = {
    const ROLL_DEPT_CODES = {
      'ECE': 'ECE', 'EC': 'ECE',
      'CSE': 'CSE', 'CS': 'CSE',
      'IT': 'IT',
      'AIDS': 'AIDS', 'AI': 'AIDS',
      'AIML': 'AIML', 'ML': 'AIML',
      'EEE': 'EEE', 'EE': 'EEE',
      'MECH': 'MECH', 'ME': 'MECH',
      'CSBS': 'CSBS', 'CB': 'CSBS',
      'CCE': 'CCE', 'CC': 'CCE',
      'CYS': 'CYBER', 'CY': 'CYBER'
    };

    function validateRegNum(rawReg) {
      const reg = (rawReg || '').trim().toUpperCase();
      if (!reg) return { valid: false, error: 'Register number is required.' };
      if (reg.length < 6 || reg.length > 20) {
        return { valid: false, error: 'Register / Roll number must be between 6 and 20 characters.' };
      }
      if (!/^[A-Z0-9]+$/i.test(reg)) {
        return { valid: false, error: 'Register number must contain letters and numbers only.' };
      }

      // 1. Anna University 12-digit format: 7228YYDDDNNN
      if (/^\d{12}$/.test(reg) && reg.startsWith('7228')) {
        const deptCode = reg.substring(6, 9);
        const dept = REG_DEPT_CODES[deptCode];
        if (dept) return { valid: true, dept, deptCode, type: 'anna_univ' };
      }

      // 2. Roll / Admission Number format: e.g. 25BEADMEC145, 25BEEC145, 24BECSE010
      const rollMatch = reg.match(/^(\d{2})(?:BE|BTECH)?(?:ADM|LAT)?(ECE|EC|CSE|CS|AIDS|AIML|AI|EEE|EE|MECH|ME|CSBS|CB|CCE|CC|CYS|CY)(\d{1,4})$/);
      if (rollMatch) {
        const deptKey = rollMatch[2];
        const dept = ROLL_DEPT_CODES[deptKey] || 'ECE';
        return { valid: true, dept, yearPrefix: rollMatch[1], type: 'college_roll' };
      }

      // 3. Fallback: Any valid alphanumeric roll number (at least 6 chars)
      return { valid: true, dept: null, type: 'generic' };
    }

    function onRegNumInput() {
      const reg = document.getElementById('registerNumber').value.trim().toUpperCase();
      const fb  = document.getElementById('regNumFeedback');
      if (!reg) { fb.textContent = ''; return; }
      const result = validateRegNum(reg);
      if (!result.valid) {
        fb.textContent = result.error;
        fb.style.color = '#ef4444';
      } else {
        if (result.dept) {
          fb.textContent = `✓ Dept detected: ${result.dept}`;
          fb.style.color = '#16a34a';
          const selectVal = REG_DEPT_TO_SELECT[result.dept];
          if (selectVal) document.getElementById('department').value = selectVal;
        } else {
          fb.textContent = `✓ Valid Register / Roll Number`;
          fb.style.color = '#16a34a';
        }

        // Auto-detect batch from leading 2 digits or 7228YY
        let yearNum = null;
        if (/^\d{12}$/.test(reg) && reg.startsWith('7228')) {
          yearNum = parseInt(reg.substring(4, 6));
        } else if (/^\d{2}/.test(reg)) {
          yearNum = parseInt(reg.substring(0, 2));
        }

        if (yearNum && !isNaN(yearNum)) {
          const startYear = 2000 + yearNum;
          const calculatedBatch = `${startYear}-${startYear + 4}`;
          const batchSelect = document.getElementById('batch');
          if (Array.from(batchSelect.options).some(opt => opt.value === calculatedBatch)) {
            batchSelect.value = calculatedBatch;
          }
        }
      }
    }

    // ── Form Submit ──
    const registerForm = document.getElementById('registerForm');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const firstName      = document.getElementById('firstName').value.trim();
      const lastName       = document.getElementById('lastName').value.trim();
      const email          = document.getElementById('email').value.trim();
      const phone          = document.getElementById('phone').value.trim();
      const password       = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const registerNumber = document.getElementById('registerNumber').value.trim();
      const department     = document.getElementById('department').value;
      const batch          = document.getElementById('batch').value;

      // Frontend validation
      const emailCheck = validateSECEEmail(email);
      if (!emailCheck.valid) {
        showAlert(emailCheck.error, 'error');
        emailInput.focus();
        return;
      }

      const regResult = validateRegNum(registerNumber);
      if (!regResult.valid) {
        showAlert(regResult.error, 'error');
        document.getElementById('registerNumber').focus();
        return;
      }

      if (!department) { showAlert('Please select your Department.', 'error'); return; }
      if (!batch)      { showAlert('Please select your Batch.', 'error'); return; }

      if (password !== confirmPassword) {
        showAlert('Passwords do not match.', 'error'); return;
      }
      if (password.length < 6) {
        showAlert('Password should be at least 6 characters.', 'error'); return;
      }

      const submitBtn = document.querySelector('.btn-register-submit');
      const origText = submitBtn.textContent;

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending OTP...';

        const response = await fetch(`${API_BASE}/auth/student/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName, lastName, email, phone, password, registerNumber, department, batch })
        });

        const data = await response.json();
        submitBtn.disabled = false;
        submitBtn.textContent = origText;

        if (response.ok && data.success) {
          showAlert('Verification OTP sent to your college email!', 'success');
          document.getElementById('verificationSentEmail').textContent = email;
          document.getElementById('verificationModalOverlay').style.display = 'flex';
          const otpInput = document.getElementById('verificationOtpInput');
          otpInput.value = '';
          otpInput.focus();
          startResendCooldown();
        } else {
          showAlert(data.message || 'Registration failed. Try again.', 'error');
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = origText;
        console.error(err);
        showAlert('Could not connect to the server. Make sure the backend is running!', 'error');
      }
    });

    let resendTimer = null;
    function startResendCooldown() {
      const resendBtn = document.getElementById('resendOtpBtn');
      if (!resendBtn) return;
      let seconds = 60;
      resendBtn.disabled = true;
      resendBtn.style.opacity = '0.6';
      resendBtn.style.cursor = 'not-allowed';
      resendBtn.textContent = `Resend OTP in ${seconds}s`;

      if (resendTimer) clearInterval(resendTimer);
      resendTimer = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(resendTimer);
          resendBtn.disabled = false;
          resendBtn.style.opacity = '1';
          resendBtn.style.cursor = 'pointer';
          resendBtn.textContent = "Didn't receive code? Resend OTP";
        } else {
          resendBtn.textContent = `Resend OTP in ${seconds}s`;
        }
      }, 1000);
    }

    async function resendVerificationOtp() {
      const email = document.getElementById('email').value.trim();
      if (!email) return;
      try {
        showAlert('Sending new verification OTP...', 'success');
        const response = await fetch(`${API_BASE}/auth/student/resend-verification`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await response.json();
        if (response.ok && data.success) {
          showAlert('A new OTP has been sent to your email.', 'success');
          startResendCooldown();
        } else {
          showAlert(data.message || 'Could not resend OTP.', 'error');
        }
      } catch (err) {
        showAlert('Error connecting to server to resend OTP.', 'error');
      }
    }

    function closeVerificationModal() {
      document.getElementById('verificationModalOverlay').style.display = 'none';
      document.getElementById('verificationOtpInput').value = '';
      if (resendTimer) clearInterval(resendTimer);
    }

    async function submitVerificationOtp() {
      const email = document.getElementById('email').value.trim();
      const otp = document.getElementById('verificationOtpInput').value.trim();
      if (otp.length !== 6) {
        showAlert('Please enter the 6-digit OTP code.', 'error');
        return;
      }

      const verifyBtn = document.getElementById('verifyOtpSubmitBtn');
      if (verifyBtn) {
        verifyBtn.disabled = true;
        verifyBtn.textContent = 'Verifying...';
      }

      try {
        const response = await fetch(`${API_BASE}/auth/student/verify-email`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp })
        });
        const data = await response.json();
        if (verifyBtn) {
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'Verify';
        }

        if (response.ok && data.success) {
          showAlert('Email verified successfully! Redirecting to login...', 'success');
          closeVerificationModal();
          setTimeout(() => { window.location.href = 'index.html'; }, 1800);
        } else {
          showAlert(data.message || 'Verification failed. Please try again.', 'error');
        }
      } catch (err) {
        if (verifyBtn) {
          verifyBtn.disabled = false;
          verifyBtn.textContent = 'Verify';
        }
        console.error(err);
        showAlert('Could not connect to the server. Make sure the backend is running!', 'error');
      }
    }

    // Auto-open modal if redirected with verifyEmail query param
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const verifyEmail = params.get('verifyEmail');
      if (verifyEmail) {
        document.getElementById('email').value = verifyEmail;
        document.getElementById('verificationSentEmail').textContent = verifyEmail;
        document.getElementById('verificationModalOverlay').style.display = 'flex';
        document.getElementById('verificationOtpInput').focus();
        startResendCooldown();
      }
    });
  </script>

  <!-- Registration OTP Verification Modal -->
  <div class="modal-overlay" id="verificationModalOverlay">
    <div class="modal-card">
      <div style="width: 52px; height: 52px; background: rgba(26,42,74,0.08); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto;">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="#1a2a4a"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
      </div>
      <h3 style="color:#1a2a4a;margin-top:0;font-size:1.3rem;font-weight:700;">Email Verification Required</h3>
      <p style="font-size:0.88rem;color:#64748b;margin:0.5rem 0 1.5rem 0;line-height:1.45;text-align:center;">
        We sent a 6-digit OTP to your SECE email:<br><strong id="verificationSentEmail" style="color:#1a2a4a;word-break:break-all;"></strong><br>Please enter the code to activate your account:
      </p>
      <input type="text" id="verificationOtpInput" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" onkeypress="if(event.key === 'Enter') submitVerificationOtp();">
      <div style="display:flex;gap:12px;margin-bottom:1rem;">
        <button type="button" class="btn-secondary" style="flex:1;" onclick="closeVerificationModal()">Cancel</button>
        <button type="button" class="btn-primary" id="verifyOtpSubmitBtn" style="flex:1;background:var(--navy);border-color:var(--navy);" onclick="submitVerificationOtp()">Verify</button>
      </div>
      <div>
        <button type="button" id="resendOtpBtn" onclick="resendVerificationOtp()" style="background:none;border:none;color:var(--navy);font-weight:600;font-size:0.85rem;cursor:pointer;padding:4px 8px;">Didn't receive code? Resend OTP</button>
      </div>
    </div>
  </div>

</body>
</html>
