name: printsta_app
description: "Printsta - SECE College Print Ordering App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  file_picker: ^8.0.0+1
  razorpay_flutter: ^1.3.7
  provider: ^6.1.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
  mobile_scanner: ^5.1.1
  flutter_local_notifications: ^17.2.1
  google_sign_in: 6.1.6
  permission_handler: 11.3.1

dependency_overrides:
  permission_handler_android: 12.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/google_logo.png
